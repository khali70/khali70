<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Ahmed Khalifa - Backend Developer, AI Agents, Real-time Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#grid)"/>

  <!-- node graph motif: agent in the middle, tools around it -->
  <g transform="translate(960 130)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="0" y1="0" x2="-110" y2="-70"/>
    <line x1="0" y1="0" x2="-120" y2="60"/>
    <line x1="0" y1="0" x2="100" y2="-75"/>
    <line x1="0" y1="0" x2="120" y2="20"/>
    <line x1="0" y1="0" x2="60" y2="90"/>
    <line x1="100" y1="-75" x2="120" y2="20"/>
    <line x1="-110" y1="-70" x2="-120" y2="60"/>
  </g>
  <g transform="translate(960 130)">
    <circle r="22" fill="url(#accent)"/>
    <circle cx="-110" cy="-70" r="9" fill="#38bdf8" fill-opacity="0.8"/>
    <circle cx="-120" cy="60" r="9" fill="#818cf8" fill-opacity="0.8"/>
    <circle cx="100" cy="-75" r="9" fill="#818cf8" fill-opacity="0.8"/>
    <circle cx="120" cy="20" r="9" fill="#38bdf8" fill-opacity="0.8"/>
    <circle cx="60" cy="90" r="9" fill="#38bdf8" fill-opacity="0.8"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="112" fill="#f8fafc" font-size="56" font-weight="700">Ahmed Khalifa</text>
    <rect x="64" y="134" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="184" fill="#cbd5e1" font-size="26" font-weight="500">Backend Developer · AI Agents · Real-time Systems</text>
    <text x="64" y="220" fill="#64748b" font-size="18">Node.js · TypeScript · LangChain · LangGraph · n8n</text>
  </g>
</svg>
